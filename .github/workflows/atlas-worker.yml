# ATLAS automation: every hour, publish fixed-price quotes, and start the Kaggle GPU worker only when paid dossiers wait.
# Needs repository secrets ATLAS_WORKER_TOKEN, KAGGLE_USERNAME, KAGGLE_KEY. The worker source stays private on Kaggle (pulled, not stored here).
name: atlas-worker
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch: {}
concurrency: { group: atlas-worker, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Auto-quote and count paid dossiers
        id: q
        env: { TOKEN: "${{ secrets.ATLAS_WORKER_TOKEN }}" }
        run: |
          if [ -z "$TOKEN" ]; then echo "ATLAS_WORKER_TOKEN not set yet"; echo "paid=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          API=https://zkglztkplmzktemdjgnr.supabase.co/functions/v1/worker
          call() { curl -sf -X POST "$API" -H "content-type: application/json" -H "x-worker-token: $TOKEN" -d "$1"; }
          call '{"action":"autoquote"}' | jq -c .
          paid=$(call '{"action":"pending"}' | jq -r .paid)
          echo "paid=$paid" >> "$GITHUB_OUTPUT"; echo "paid dossiers: $paid"
      - name: Start Kaggle worker if needed
        if: steps.q.outputs.paid != '0'
        env: { KAGGLE_USERNAME: "${{ secrets.KAGGLE_USERNAME }}", KAGGLE_KEY: "${{ secrets.KAGGLE_KEY }}" }
        run: |
          pip install -q kaggle
          st=$(kaggle kernels status raphaellokadjo/atlas-worker 2>&1 || true); echo "$st"
          if echo "$st" | grep -qE "RUNNING|QUEUED"; then echo "worker already running"; exit 0; fi
          kaggle kernels pull raphaellokadjo/atlas-worker -p w -m
          kaggle kernels push -p w --accelerator NvidiaTeslaT4

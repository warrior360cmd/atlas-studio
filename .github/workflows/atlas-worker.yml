# ATLAS automation: every hour, publish fixed-price quotes, and start the Kaggle GPU worker only when paid dossiers wait.
# Needs repository secrets ATLAS_WORKER_TOKEN and KAGGLE_API_TOKEN. The worker source stays private on Kaggle (pulled, not stored here).
name: atlas-worker
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch: {}
concurrency: { group: atlas-worker, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Auto-quote and count paid dossiers
        id: q
        env: { TOKEN: "${{ secrets.ATLAS_WORKER_TOKEN }}" }
        run: |
          if [ -z "$TOKEN" ]; then echo "ATLAS_WORKER_TOKEN not set yet"; echo "run=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          API=https://zkglztkplmzktemdjgnr.supabase.co/functions/v1/worker
          call() { curl -sf -X POST "$API" -H "content-type: application/json" -H "x-worker-token: $TOKEN" -d "$1"; }
          # the repository is public, so are its logs: never print refs or order counts
          call '{"action":"autoquote"}' > /dev/null
          paid=$(call '{"action":"pending"}' | jq -r .paid)
          if [ "$paid" -gt 0 ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "run=no" >> "$GITHUB_OUTPUT"; fi
          echo "tick done"
      - name: Start Kaggle worker if needed
        if: steps.q.outputs.run == 'yes'
        env: { KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}" }
        run: |
          pip install -q kaggle==2.2.5
          st=$(kaggle kernels status raphaellokadjo/atlas-worker 2>&1 || true)
          if echo "$st" | grep -qE "RUNNING|QUEUED"; then echo "worker busy"; exit 0; fi
          kaggle kernels pull raphaellokadjo/atlas-worker -p w -m > /dev/null
          kaggle kernels push -p w --accelerator NvidiaTeslaT4 > /dev/null && echo "worker started"
